<rect x="345" y="354" width="585" height="92" rx="8" fill="#1a1b22" stroke="#b9c0cc" stroke-width="3"/><text x="363" y="386" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f4f8">Shared by the games</text><text x="363" y="410" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="14" fill="#b9c0cc">stand/stand.py drawing and effects</text><text x="363" y="430" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="14" fill="#b9c0cc">ciz_tanima.onnx sketch classifier (Cizim Kahini)</text>
