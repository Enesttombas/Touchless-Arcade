<text x="30" y="44" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#48d05a">ONE FRAME, START TO SCREEN</text>
<rect x="30" y="74" width="270" height="92" rx="8" fill="#1a1b22" stroke="#39d4f0" stroke-width="3"/><text x="48" y="106" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f4f8">Camera</text><text x="48" y="130" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="14" fill="#b9c0cc">cekirdek.Kamera()</text><text x="48" y="150" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="14" fill="#b9c0cc">USB index or tcp:// bridge</text>
