<rect x="660" y="74" width="270" height="92" rx="8" fill="#1a1b22" stroke="#39d4f0" stroke-width="3"/><text x="678" y="106" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f4f8">Algilayici</text><text x="678" y="130" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="14" fill="#b9c0cc">oyunlar/cekirdek.py</text><text x="678" y="150" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="14" fill="#b9c0cc">MediaPipe face/gesture/pose</text>
<rect x="660" y="214" width="270" height="92" rx="8" fill="#1a1b22" stroke="#ffd400" stroke-width="3"/><text x="678" y="246" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f4f8">OyuncuKapisi</text><text x="678" y="270" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="14" fill="#b9c0cc">oyunlar/oyuncu.py</text><text x="678" y="290" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="14" fill="#b9c0cc">who is in the frame, who left</text>
<rect x="345" y="214" width="270" height="92" rx="8" fill="#1a1b22" stroke="#ffd400" stroke-width="3"/><text x="363" y="246" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f2f4f8">StantUygulama + AnaMenu</text><text x="363" y="270" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="14" fill="#b9c0cc">oyunlar/stant_app.py</text><text x="363" y="290" font-family="Consolas,'Cascadia Mono',Menlo,monospace" font-size="14" fill="#b9c0cc">1 s dwell select, crash guard</text>
