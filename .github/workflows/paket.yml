name: Windows paketi

# master her güncellendiğinde, açıp çift tıklayınca hiçbir şey indirmeden çalışan
# hazır Windows ZIP'ini (taşınabilir Python + tüm paketler dahil) üretir ve
# "windows" sürümüne koyar. README'deki İndir düğmesi bu dosyayı gösterir.
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-paketi
  cancel-in-progress: true

jobs:
  paket:
    name: Hazır Windows ZIP'i
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Taşınabilir Python ve oyun paketlerini kur
        shell: cmd
        run: BASLAT.bat --kur

      - name: Duman testi (paketler ve oyun içe aktarılıyor mu)
        shell: cmd
        run: app\python\python.exe -c "import sys; sys.path.insert(0, 'oyunlar'); import cv2, mediapipe, onnxruntime, numpy, stant_app; print('ok', sys.version)"

      - name: ZIP'i hazırla
        shell: pwsh
        run: |
          $hedef = Join-Path $env:RUNNER_TEMP 'paket\Touchless-Arcade'
          New-Item -ItemType Directory -Force -Path $hedef | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git', '.github') } |
            Copy-Item -Destination $hedef -Recurse -Force
          Get-ChildItem $hedef -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Push-Location (Split-Path $hedef)
          7z a -tzip -mx=5 "$env:GITHUB_WORKSPACE\Touchless-Arcade-Windows.zip" Touchless-Arcade | Out-Null
          Pop-Location
          "ZIP boyutu: {0:N0} MB" -f ((Get-Item Touchless-Arcade-Windows.zip).Length / 1MB)

      - name: Sürümü yayınla
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          $notlar = @"
          **İndir → ZIP'e sağ tıkla → Tümünü ayıkla → ``BASLAT.bat``'a çift tıkla.**

          İçinde oyunun taşınabilir Python'u ve tüm paketleri hazır; ilk açılışta hiçbir şey indirilmez, bilgisayara bir şey kurulmaz.
          Windows 10/11 (64 bit) ve bir kamera yeterli.

          Kaynak: $env:GITHUB_SHA
          "@
          gh release create windows Touchless-Arcade-Windows.zip --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA --title "Touchless Arcade — Windows (hazır paket)" --notes $notlar --latest
