name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-windows:
    name: Windows Python 3.11 Full Suite
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Bytecode compilation check
        run: |
          python -m compileall -q oyunlar stand tools

      - name: Run quick synthetic preview render
        run: |
          python tools/render_preview.py --quick

      - name: Run test suite
        run: |
          python -m pytest -q tests -p no:cacheprovider

  install-windows:
    name: Windows one-click install (BASLAT.bat)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install with BASLAT.bat (portable Python, no system Python used)
        shell: cmd
        run: BASLAT.bat --kur

      - name: Import game stack with the portable Python
        shell: cmd
        run: app\python\python.exe -c "import sys; sys.path.insert(0, 'oyunlar'); import cv2, mediapipe, onnxruntime, numpy, pygame, stant_app; print('ok', sys.version)"

      - name: Render preview with the portable Python
        shell: cmd
        run: app\python\python.exe tools\render_preview.py --quick
